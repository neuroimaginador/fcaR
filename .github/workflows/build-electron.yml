# GitHub Actions workflow for building fcaRviz as a native Electron desktop app
# Produces macOS (arm64, x64) and Windows (x64) bundled installers and attaches
# them to a GitHub Release on fcaRviz-v* or v* tags.

name: Build fcaRviz Desktop App

on:
  push:
    tags:
      - 'fcaRviz-v*'
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install shinyelectron
        shell: Rscript {0}
        run: |
          if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = "https://cloud.r-project.org")
          pak::pak(c("coatless-rpkg/shinyelectron", "renv"))

      - name: Build Electron app
        shell: Rscript {0}
        run: |
          appdir <- normalizePath(file.path(Sys.getenv("GITHUB_WORKSPACE"), "inst/shiny-examples/fcaRviz"), winslash = "/", mustWork = TRUE)
          destdir <- normalizePath(file.path(Sys.getenv("RUNNER_TEMP"), "fcarviz-build"), winslash = "/", mustWork = FALSE)
          shinyelectron::export(
            appdir = appdir,
            destdir = destdir,
            app_name = "fcaRviz",
            platform = "${{ matrix.platform }}",
            arch = "${{ matrix.arch }}",
            runtime_strategy = "bundled",
            sign = FALSE,
            overwrite = TRUE
          )

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: fcarviz-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/fcarviz-build/electron-app/dist/*.dmg
            ${{ runner.temp }}/fcarviz-build/electron-app/dist/*.exe
            ${{ runner.temp }}/fcarviz-build/electron-app/dist/*.blockmap
            ${{ runner.temp }}/fcarviz-build/electron-app/dist/latest*.yml
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          body: |
            ## fcaRviz Desktop Installers (macOS & Windows)

            Standalone desktop builds bundled with R and all required packages (offline-ready).

            > **Note on unsigned binaries:**
            > - **macOS:** Right-click `fcaRviz.app` → **Open** on first launch (or run `xattr -cr /Applications/fcaRviz.app` in Terminal if Gatekeeper reports it as damaged).
            > - **Windows:** On the SmartScreen prompt, click **More info** → **Run anyway**.
